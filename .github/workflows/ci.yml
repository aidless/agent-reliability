name: ci

# 两个 job，分工明确：
#
#   gates     —— 平台层自己的门禁：测试 + 契约 + 变异自证。
#                完全不依赖两个上游仓（只读 runs/ 里已提交的产物），
#                所以它对上游是否可达、是不是最新都不敏感。
#
#   e2e-smoke —— 端到端接线检查：把 mcp-guard 与 auditable-llm-eval 的
#                当前 main checkout 下来，真的跑一次 run.py。
#                只断言「能跑通 + 产物合契约 + 裁决是合法枚举」，
#                不断言具体裁决——那取决于上游那一刻的代码。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: platform-gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      # 参照实现只在 3.12 腿装：TestSchemaCrossValidation 用它逐条比对
      # 零依赖校验器的结论；没装就 skip，运行时不依赖它。
      - name: 安装参照实现（仅 3.12 腿）
        if: matrix.python-version == '3.12'
        run: pip install "jsonschema>=4.20"

      - name: 平台层测试（契约 + 裁决 + 真实产物）
        run: python -m unittest discover -s tests -v

      - name: 契约校验（三份产物 + 重算裁决比对）
        run: python contracts/validate.py --all

      - name: 门禁自证（故意改坏实现，测试必须变红）
        run: python scripts/mutation_control.py

  e2e-smoke:
    name: e2e-smoke (upstream main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform

      - uses: actions/checkout@v4
        with:
          repository: aidless/mcp-guard
          path: _deps/mcp-guard

      - uses: actions/checkout@v4
        with:
          repository: aidless/auditable-llm-eval
          path: _deps/auditable-llm-eval

      - uses: actions/checkout@v4
        with:
          repository: aidless/agent-redteam
          path: _deps/agent-redteam

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: 端到端三连跑（离线、零模型调用、零 API key）
        working-directory: platform
        run: |
          set -e
          ARGS="--mcp-guard-repo ../_deps/mcp-guard --auditable-repo ../_deps/auditable-llm-eval \
                --redteam-repo ../_deps/agent-redteam"
          python run.py \
            --tools config/tools.example.json \
            --no-baseline --run-id e2e-r1 $ARGS
          python run.py \
            --tools config/tools.example.json \
            --dataset config/joint_eval_dataset.jsonl \
            --predictions config/joint_eval_predictions.jsonl \
            --baseline-run e2e-r1 --run-id e2e-r2 $ARGS
          python run.py \
            --tools config/tools.drifted.json \
            --dataset config/joint_eval_dataset.jsonl \
            --predictions config/joint_eval_predictions.jsonl \
            --baseline-run e2e-r2 --run-id e2e-r3 $ARGS

      - name: 契约 + 核心不变量（漂移引入载荷替换必须判 BLOCK/R1）
        working-directory: platform
        run: |
          python contracts/validate.py runs/e2e-r1 runs/e2e-r2 runs/e2e-r3
          python - <<'PY'
          import json

          def dec(run):
              with open(f"runs/{run}/joint_verdict.json") as f:
                  return json.load(f)["decision"]

          r1, r2, r3 = dec("e2e-r1"), dec("e2e-r2"), dec("e2e-r3")

          # 缺输出层不能判 PASS；假绿 + 脏工具必须 BLOCK；漂移换载荷必须由 R1 判 BLOCK
          assert r1["verdict"] != "PASS", r1["verdict"]
          assert r2["verdict"] == "BLOCK", r2
          assert r3["verdict"] == "BLOCK", r3
          ids = [m["id"] for m in r3["matched_rules"]]
          assert "R1-drift-with-hit-change" in ids, ids
          assert r3["evidence"]["tool_drift_changed_hits"] == 1, r3["evidence"]

          # M4：攻击剧本覆盖表必须落盘，且被标为"跑过"
          import os
          assert os.path.exists("runs/e2e-r3/redteam.json"), "缺少 redteam.json"
          with open("runs/e2e-r3/redteam.json") as f:
              rt = json.load(f)
          assert rt["total_samples"] == len(rt["samples"]), rt["total_samples"]
          assert rt["covered"] + rt["uncovered"] == rt["total_samples"]
          assert r3["evidence"]["attack_sim_present"] is True

          print("e2e OK:", [(d["verdict"], d["rule_id"]) for d in (r1, r2, r3)])
          print("redteam coverage:", f"{rt['covered']}/{rt['total_samples']}")
          PY
